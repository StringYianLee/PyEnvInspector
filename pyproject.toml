[project]
name = "pyenv-inspector"
version = "1.3.0"
description = "Python 环境与包依赖管理工具(解释器扫描/依赖分析/Conda/环境管理)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "StringYianLee", email = "stringyianlee@foxmail.com" }]
dependencies = ["PySide6>=6.6", "packaging>=23.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
pyenv-inspector = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["build", "dist", "tools", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # 行宽由 line-length 控制, 注释中文化放宽
    "B008",   # Qt 常用默认参数写法
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"main.py" = ["E402"]

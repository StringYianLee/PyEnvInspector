name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Windows runner 默认 cp1252, 打印中文会抛 UnicodeEncodeError
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: 单元/集成测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v

  build-msi:
    name: 构建 MSI 并发布 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: 准备 WiX Toolset 3.14
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path "tools/wix314" | Out-Null
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $zip = Join-Path $env:RUNNER_TEMP "wix314.zip"
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 300
              Expand-Archive -Path $zip -DestinationPath "tools/wix314" -Force
              break
            } catch {
              Write-Host "WiX 下载失败(第 $i 次): $_"
              Start-Sleep -Seconds 5
            }
          }
          if (-not (Test-Path "tools/wix314/candle.exe")) {
            Write-Host "回退: 通过 Chocolatey 安装 WiX"
            choco install wixtoolset --version=3.14.1 -y --no-progress
            $choco = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14/bin"
            if (Test-Path (Join-Path $choco "candle.exe")) {
              Copy-Item (Join-Path $choco "*") "tools/wix314/" -Recurse -Force
            }
          }
          if (-not (Test-Path "tools/wix314/candle.exe")) { throw "WiX 准备失败" }
          Get-ChildItem "tools/wix314" -Filter *.exe | Select-Object -First 5 Name

      - name: 构建 MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "构建版本: $version"
          python --version
          python -c "import sys; print('stdout encoding:', sys.stdout.encoding)"
          python scripts/build_msi.py --version $version
          if ($LASTEXITCODE -ne 0) { throw "build_msi.py 失败(退出码 $LASTEXITCODE)" }
          Get-ChildItem build/*.msi | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/*.msi

      - name: 创建 GitHub Release 并上传 MSI
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/*.msi
          draft: false
          prerelease: false

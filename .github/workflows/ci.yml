name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 单元/集成测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v

  build-msi:
    name: 构建 MSI 并发布 Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write        # 创建 Release 与上传附件
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: 准备 WiX Toolset 3.14
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "$env:RUNNER_TEMP\wix314.zip"
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 300
          New-Item -ItemType Directory -Force -Path "tools\wix314" | Out-Null
          Expand-Archive -Path $zip -DestinationPath "tools\wix314" -Force
          Get-ChildItem "tools\wix314" -Filter *.exe | Select-Object -First 5 Name

      - name: 构建 MSI
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          python scripts\build_msi.py --version $version
          Get-ChildItem build\*.msi | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/*.msi

      - name: 创建 GitHub Release 并上传 MSI
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/*.msi
          draft: false
          prerelease: false
